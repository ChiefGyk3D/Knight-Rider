# SPDX-License-Identifier: Apache-2.0
# CodeQL over the workflow files, gitleaks, dependency review on pull requests, Semgrep and OpenSSF Scorecard.
# The jobs live in ChiefGyk3D/git-your-ship-together. There is no Python here, so no pip-audit.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, so new advisories surface between commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/security.yml@01f397834f7acc553593abefbba135b18f580730 # v1.34.0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      id-token: write
    secrets:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}   # optional Service Token fallback; unset means OIDC only
    with:
      codeql-languages: actions
      pip-audit-requirements: ''
      scorecard: true
      egress-policy: block
