# SPDX-License-Identifier: Apache-2.0
# Shell lint and the repository's own checks (the address check and its test, through tests/run.sh) are
# ChiefGyk3D/git-your-ship-together's bash-ci.yml; it reports its gate as `CI green`, here `ci / CI green`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/bash-ci.yml@7501cb3fa19d83d0e0a131cb040e7c4da32a9504 # v1.28.0
    permissions:
      contents: read
    with:
      shfmt-args: "-i 4 -ci"
      test-command: ./tests/run.sh
      egress-policy: block
